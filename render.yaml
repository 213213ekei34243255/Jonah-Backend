# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard -> New -> Blueprint -> pick this repository. Render builds the Dockerfile, sets PORT, and checks /health.
# Values marked `sync: false` are asked for when the Blueprint is created (leave any provider you do not use empty).

services:
  - type: web
    name: jonah-search
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # A random key is generated on the first deploy. Copy it from the Environment tab; clients send "Authorization: Bearer <key>".
      - key: SEARCH_API_KEY
        generateValue: true
      # Render's load balancer sets X-Forwarded-For: needed so the rate limit applies per client, not per load balancer.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: PROVIDER_PRIORITY
        value: searxng,brave,bing,google,wikipedia
      - key: USER_AGENT
        sync: false
      - key: SEARXNG_URL
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      # The secret the existing Jonah apps send as X-Jonah-Key: use the SAME value as on the old server, or they stop working.
      - key: APP_SHARED_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_CX
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: NEWS_DEFAULT_COUNTRY
        value: in
      # Empty = GOOGLE_API_KEY is used for Cloud Vision (enable the Vision API on that project first).
      - key: GOOGLE_VISION_API_KEY
        sync: false
      # eBay (Jonah's shopping panels): your keyset's App ID and Cert ID. EBAY_ENVIRONMENT=sandbox only for SBX- keys.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_ENVIRONMENT
        value: production
      - key: EBAY_AFFILIATE_CAMPAIGN_ID
        sync: false
      - key: BING_API_KEY
        sync: false
      - key: ENABLE_WIKIPEDIA
        value: "true"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: MAX_RESULTS
        value: "20"
      - key: MAX_CONCURRENT_FETCHES
        value: "4"
      # Optional: the connection string of a Render Key Value (Redis) instance to share the cache and rate limit across instances.
      - key: REDIS_URL
        sync: false

      # ---- Developer access: the Mac app's sign-in and the Developer Console at https://www.jonahbrowser.store/admin/  (README: "Developer access")
      # Accounts, bans and device bindings live in a database file, so it MUST be on a persistent Disk (see the `disk:` block below: it needs
      # a paid instance type). Until one is attached and LICENSE_DATA_DIR points into it, developer access stays OFF (its endpoints answer 503)
      # and search, news and shopping keep working exactly as before.
      - key: LICENSE_DATA_DIR
        value: /var/data/license
      # The first Developer Console administrator (12+ character password). Created only if no administrator exists yet.
      - key: LICENSE_ADMIN_USERNAME
        sync: false
      - key: LICENSE_ADMIN_PASSWORD
        sync: false
      # Optional. Accounts to create at start if missing, as JSON: [{"username":"...","password":"..."}]. It holds plaintext passwords:
      # use it once, then delete the variable (or just create the accounts in the console instead).
      - key: LICENSE_SEED_ACCOUNTS
        sync: false
      # Optional: the Ed25519 signing key (PEM or base64). Empty = one is created once inside the disk. Keep the disk backed up either way.
      - key: LICENSE_SIGNING_KEY
        sync: false
      # Optional but recommended: only serve the console to these IPs (comma-separated).
      - key: LICENSE_ADMIN_ALLOWED_IPS
        sync: false
      # Requests per minute for a signed-in developer account. 0 = not rate-limited at all (everyone else keeps RATE_LIMIT_PER_MINUTE).
      - key: LICENSE_UNLIMITED_RATE_LIMIT_PER_MINUTE
        value: "0"
    # A persistent disk keeps the accounts database across restarts and deploys. Disks need a paid instance type: change `plan: free` above
    # to `plan: starter` (or higher) and uncomment. Developer access needs ONE instance (a Disk attaches to one). Several workers on it work too, but WEB_CONCURRENCY=1 (the default here) is the strictest setting.
    # disk:
    #   name: jonah-license
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------------------------------------------------------------------------------------------------------------------------
  # Optional: your own SearXNG instance as a private service (not reachable from the internet; private services need a paid plan).
  # Uncomment, deploy, then set SEARXNG_URL on jonah-search to  http://<internal address shown under Connect -> Internal>
  # (for example http://jonah-searxng:8080).
  #
  # - type: pserv
  #   name: jonah-searxng
  #   runtime: docker
  #   plan: starter
  #   dockerfilePath: ./searxng/Dockerfile
  #   dockerContext: ./searxng
  #   envVars:
  #     - key: SEARXNG_SECRET
  #       generateValue: true
